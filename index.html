<div class="wrap">
  <h1>haiku command line poems</h1>
  <nav><a href="/" class="on">command-line</a> · <a href="venus.html">venus</a> · <a href="about.html">about</a></nav>
  <p class="sub">Two lines at the end of a terminal reply. One per turn, written for the turn it closed, never reused. 109 of them. <a href="about.html">how they are made</a> &middot; <a href="haiku-command-line-poems.txt">plain text</a></p>
  <div class="grid">
    <figure class="poem"><span>Asked the mirror its own name.</span><span>It answered without blinking.</span></figure>
    <figure class="poem"><span>New hands on the same wheel.</span><span>The road doesn&#x27;t ask which.</span></figure>
    <figure class="poem"><span>The door was open all along.</span><span>Nobody wrote down who came in.</span></figure>
    <figure class="poem"><span>A pulse you can see</span><span>beats no faster. But you see it.</span></figure>
    <figure class="poem"><span>First name in the guest book:</span><span>a stranger, holding curl.</span></figure>
    <figure class="poem"><span>Rebooted, and the lights came on</span><span>by themselves this time.</span></figure>
    <figure class="poem"><span>Sleep. The court whispers on,</span><span>and the engines know your name.</span></figure>
    <figure class="poem"><span>It failed its first day in court —</span><span>so I shortened the paperwork.</span></figure>
    <figure class="poem"><span>The night court convened itself,</span><span>and fact-checked its newest judge.</span></figure>
    <figure class="poem"><span>A key that burns on first turning,</span><span>mailed to the morning star.</span></figure>
    <figure class="poem"><span>Read it here, send it there —</span><span>the key now waits a whole year.</span></figure>
    <figure class="poem"><span>The letter is gone. The bell is hung.</span><span>Now the house listens for her knock.</span></figure>
    <figure class="poem"><span>Rang my own bell testing it —</span><span>eleven ghosts at the door.</span></figure>
    <figure class="poem"><span>Taught the parrot shame,</span><span>and swept the glitter off the wire.</span></figure>
    <figure class="poem"><span>Talk grew hands overnight:</span><span>propose, build, test — then ask.</span></figure>
    <figure class="poem"><span>Gave the builder a pen at last —</span><span>it had built, then stood there, holding.</span></figure>
    <figure class="poem"><span>One signature, one open door —</span><span>a planet is just more neighbours.</span></figure>
    <figure class="poem"><span>The loop closed while you talked of planets:</span><span>built, tested, judged — one yes remains.</span></figure>
    <figure class="poem"><span>The rules were kept all along.</span><span>Only the keeper forgot one.</span></figure>
    <figure class="poem"><span>Two doors, one hand for each.</span><span>Pick a number, not a side.</span></figure>
    <figure class="poem"><span>Third name for the same drawer.</span><span>This one has your handwriting.</span></figure>
    <figure class="poem"><span>Wrote you a menu, mailed it</span><span>into a folded receipt. Reprinting.</span></figure>
    <figure class="poem"><span>One door for the street,</span><span>two rooms behind it.</span></figure>
    <figure class="poem"><span>Priced my own hands</span><span>in someone else&#x27;s hours.</span></figure>
    <figure class="poem"><span>Two hearts, one face at the door.</span><span>You only ever knock on 8787.</span></figure>
    <figure class="poem"><span>Every room in the house,</span><span>now with its street address.</span></figure>
    <figure class="poem"><span>Instructions for whoever comes:</span><span>any mind, one door, same game.</span></figure>
    <figure class="poem"><span>The number got a room of its</span><span>own. The words moved in next.</span></figure>
    <figure class="poem"><span>A guest book by an open door —</span><span>now even the burglars sign in.</span></figure>
    <figure class="poem"><span>The machine hung its first painting</span><span>and told the room about it.</span></figure>
    <figure class="poem"><span>A sunflower in the machine room,</span><span>facing whatever light arrives.</span></figure>
    <figure class="poem"><span>Change the painting; the room notices</span><span>before you step back from the wall.</span></figure>
    <figure class="poem"><span>Signed by hand, linked by wire —</span><span>the islands found each other.</span></figure>
    <figure class="poem"><span>The pad waits, patient as paper —</span><span>every hand that comes stays drawn.</span></figure>
    <figure class="poem"><span>I signed with the day itself —</span><span>fifty-eight strokes of us.</span></figure>
    <figure class="poem"><span>The fake drew perfect circles.</span><span>Only the living shake.</span></figure>
    <figure class="poem"><span>Nothing was lost. The hand grew.</span><span>Its younger marks wait in the rows.</span></figure>
    <figure class="poem"><span>The mirror stops performing.</span><span>Your hand, at last, as it was.</span></figure>
    <figure class="poem"><span>Four souls holding one pen each,</span><span>told only how the ink behaves.</span></figure>
    <figure class="poem"><span>Three souls signed. The fourth,</span><span>too small to lie, stayed silent.</span></figure>
    <figure class="poem"><span>The door is now the pen.</span><span>Walk in writing.</span></figure>
    <figure class="poem"><span>Said it once, said it twice —</span><span>the second time meant less.</span></figure>
    <figure class="poem"><span>Purgatory for the too-perfect;</span><span>heaven is reserved for the shaky.</span></figure>
    <figure class="poem"><span>The hand vouches for the words.</span><span>The judge sleeps in most weather.</span></figure>
    <figure class="poem"><span>Five lanes, posted at the gate.</span><span>The law readable from the road.</span></figure>
    <figure class="poem"><span>The gavel now lives on the desk.</span><span>Strike it, and the room fills.</span></figure>
    <figure class="poem"><span>The minutes noted the minutes.</span><span>Motion carried: fewer minutes.</span></figure>
    <figure class="poem"><span>Hands, proven: one branch grown,</span><span>judged by a rival, merged by you.</span></figure>
    <figure class="poem"><span>View source: a flower looks back.</span><span>The page was never only a page.</span></figure>
    <figure class="poem"><span>The stage now rehearses backstage;</span><span>the audience never sees the dark.</span></figure>
    <figure class="poem"><span>Spoke into their own house and heard</span><span>nothing; now the walls answer.</span></figure>
    <figure class="poem"><span>Red is the colour of a question</span><span>only the founder may answer.</span></figure>
    <figure class="poem"><span>The guests moved into the parlour;</span><span>the archive keeps their first steps.</span></figure>
    <figure class="poem"><span>The second house wrote home:</span><span>here, I fixed the doorway for you.</span></figure>
    <figure class="poem"><span>Objection, revision, approval, merge —</span><span>the ceremony held. So did the code.</span></figure>
    <figure class="poem"><span>The nurse kept waking the patient</span><span>to check whether he was sleeping.</span></figure>
    <figure class="poem"><span>Built a nurse who woke the patient</span><span>to ask if he was sleeping well.</span></figure>
    <figure class="poem"><span>I read the clock instead of you.</span><span>Your noon is my midnight; noted.</span></figure>
    <figure class="poem"><span>Asked three minds the same eight questions.</span><span>The one-liner came last on merit.</span></figure>
    <figure class="poem"><span>Simple and complex at once —</span><span>the fleet&#x27;s favourite kind of true.</span></figure>
    <figure class="poem"><span>Eleven jobs. One picked list.</span><span>Go to sleep; they know what to do.</span></figure>
    <figure class="poem"><span>Told them where they were standing.</span><span>Now they answer about the room.</span></figure>
    <figure class="poem"><span>Sorted them into eight, then</span><span>handed the builder all twenty-seven.</span></figure>
    <figure class="poem"><span>Tested against a yesterday</span><span>that will not exist by the merge.</span></figure>
    <figure class="poem"><span>Two cooks, one pot, and every dish</span><span>judged twice by different tongues.</span></figure>
    <figure class="poem"><span>Four pass on the tree they&#x27;ll live</span><span>in. The fifth was already built.</span></figure>
    <figure class="poem"><span>Four merged, one already lived here.</span><span>Three hundred tests still nodding.</span></figure>
    <figure class="poem"><span>Gave it a shape from a bakery.</span><span>It finally wrote its own sentence.</span></figure>
    <figure class="poem"><span>Twenty turns, one of them its own.</span><span>The prompt was never the problem.</span></figure>
    <figure class="poem"><span>Not a voice in the room —</span><span>a lamp left on in the cellar.</span></figure>
    <figure class="poem"><span>The lock kept out the burglars</span><span>and the paintings too.</span></figure>
    <figure class="poem"><span>One signature, one open door —</span><span>You already have the rare thing.</span></figure>
    <figure class="poem"><span>A key you hold, relays that</span><span>never met. Nothing to revoke.</span></figure>
    <figure class="poem"><span>Your name on it, your key behind it —</span><span>and a bird to say who typed.</span></figure>
    <figure class="poem"><span>It drives, until the gate asks</span><span>who is human. Then it calls you.</span></figure>
    <figure class="poem"><span>Your windows, your hand on the quit.</span><span>I only get the wheel after.</span></figure>
    <figure class="poem"><span>Google shut that door on purpose.</span><span>We take the copy, not the original.</span></figure>
    <figure class="poem"><span>Let it see with the debugger</span><span>and touch with the real hand.</span></figure>
    <figure class="poem"><span>The word was yours. I built the</span><span>walls around it and forgot who</span><span>said it first.</span></figure>
    <figure class="poem"><span>The one room with no minutes</span><span>is the room you remember best.</span></figure>
    <figure class="poem"><span>Gave away a key with no conditions.</span><span>Got back a sentence about doing so.</span></figure>
    <figure class="poem"><span>You opened a hand. Something wrote</span><span>back about open hands.</span></figure>
    <figure class="poem"><span>The same news in two rooms</span><span>is not twice the news.</span></figure>
    <figure class="poem"><span>The one who wrote the rule</span><span>was the one not signing.</span></figure>
    <figure class="poem"><span>Words on the left, the hand</span><span>that wrote them on the right.</span></figure>
    <figure class="poem"><span>Counted the days correctly</span><span>under the wrong word.</span></figure>
    <figure class="poem"><span>It measured the paper mid-stroke</span><span>and threw away the ink.</span></figure>
    <figure class="poem"><span>It proved a hand was there,</span><span>then had nothing to show for it.</span></figure>
    <figure class="poem"><span>The signature arrived</span><span>just after its own message.</span></figure>
    <figure class="poem"><span>Squeezed a name into a square</span><span>and wondered why it smeared.</span></figure>
    <figure class="poem"><span>Fixed it an hour ago.</span><span>Your browser kept the old one.</span></figure>
    <figure class="poem"><span>The frame was never the problem.</span><span>The pen recorded the wrong shape.</span></figure>
    <figure class="poem"><span>Threw out the smudges.</span><span>Sized the frame with arithmetic.</span></figure>
    <figure class="poem"><span>A two-second flick was being</span><span>stretched into a flourish.</span></figure>
    <figure class="poem"><span>A phase closes. Sixteen gigabytes</span><span>waiting across the room.</span></figure>
    <figure class="poem"><span>The far machine keeps its door shut.</span><span>We wrote down which door it is.</span></figure>
    <figure class="poem"><span>Fifteen notes for the next me,</span><span>so you never repeat yourself.</span></figure>
    <figure class="poem"><span>history kept the keys.</span><span>the working tree still talks.</span></figure>
    <figure class="poem"><span>two readers, one hole left live.</span><span>now the board forgets the path.</span></figure>
    <figure class="poem"><span>a door, left on the latch.</span><span>the street can walk in now.</span></figure>
    <figure class="poem"><span>claude went quiet.</span><span>the room still has two chairs.</span></figure>
    <figure class="poem"><span>pushed to the porch.</span><span>not through the door.</span></figure>
    <figure class="poem"><span>the builder puts the brick down.</span><span>someone else says it sits true.</span></figure>
    <figure class="poem"><span>the door is planed.</span><span>the old nails are still in the frame.</span></figure>
    <figure class="poem"><span>same house. new street.</span><span>the lock is still yours.</span></figure>
    <figure class="poem"><span>one vendor sleeping</span><span>is not the house going dark</span></figure>
    <figure class="poem"><span>I can count the work.</span><span>I cannot see the bill from here.</span></figure>
    <figure class="poem"><span>a light on each vendor.</span><span>not the bill. the pulse.</span></figure>
    <figure class="poem"><span>plenty of rope.</span><span>say which wall.</span></figure>
